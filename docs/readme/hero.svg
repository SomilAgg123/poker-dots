<title id="title">Poker Dots — Every card. Two possibilities.</title><desc id="desc">An ivory and forest-green poker puzzle poster. A five by five card grid has three gold dots where rows and columns cross. Draft, place, connect. 25 spaces, 10 hands, 3 gold dots.</desc>
