<text x="78" y="503" fill="#edc47d" font-family="Georgia,serif" font-size="43">Every card. Two possibilities.</text>
<text x="78" y="564" fill="#becdbd" font-family="Arial,sans-serif" font-size="27">Build poker hands across a shared grid.</text>
